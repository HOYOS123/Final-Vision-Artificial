<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Virtual Air Jam - Live Concert</title>

  <!-- 1. p5.js -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>
  <!-- 2. ML5.js -->
  <script src="https://unpkg.com/ml5@0.12.2/dist/ml5.min.js"></script>

  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #05070d;
      color: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      overflow: hidden;
    }
    h1 {
      margin: 10px 0 5px 0;
      font-size: 24px;
      letter-spacing: 2px;
      color: #00f3ff;
      text-shadow: 0 0 10px rgba(0, 243, 255, 0.5);
    }
    canvas {
      border: 2px solid #00f3ff;
      box-shadow: 0 0 35px rgba(0, 243, 255, 0.25);
      border-radius: 16px;
    }
  </style>
</head>
<body>

  <h1>VIRTUAL AIR JAM - LIVE CONCERT</h1>
  <div id="canvas-container"></div>

  <script>
    let video;
    let poseNet;
    let poses = [];
    let isAiReady = false;

    // Modo de instrumento
    let currentInstrument = "GUITARRA";

    // Botones Flotantes en las 4 Esquinas
    let buttons = [
      { id: "GUITARRA", label: "GUITARRA", x: 75, y: 70, r: 35, color: [255, 0, 128], hoverTime: 0 },
      { id: "TROMPETA", label: "TROMPETA", x: 565, y: 70, r: 35, color: [0, 243, 255], hoverTime: 0 },
      { id: "BATERÍA", label: "BATERÍA", x: 75, y: 410, r: 35, color: [255, 215, 0], hoverTime: 0 },
      { id: "TECLADO", label: "TECLADO", x: 565, y: 410, r: 35, color: [255, 50, 30], hoverTime: 0 }
    ];

    const HOVER_THRESHOLD = 18;

    // Sistemas FX
    let fxParticles = [];
    let shockwaves = [];
    let lightningRays = [];
    let fogParticles = [];

    // Físicas y Energía (Stage Hype)
    let jamEnergy = 0;
    let eqBars = Array(16).fill(0);

    // Guitarra
    let guitarStrumCooldown = 0;
    let guitarActiveTimer = 0;

    // Batería
    let hitToms = [0, 0, 0, 0];
    let hitKick = 0;
    let hitLeftCymbal = 0, hitRightCymbal = 0;
    let prevLwY = 0, prevRwY = 0;
    let prevBodyX = 0, prevBodyY = 0;
    let prevLKneeY = 0, prevRKneeY = 0;

    // --- LIBRERÍA DE AUDIO CON ARCHIVOS REALES ---
    let audioCtx;
    let soundLibrary = {};

    function initAudio() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        
        soundLibrary = {
          guitarra: new Audio('audio/Guitar.wav'),
          trompeta: new Audio('audio/Trumpet.mp3'),
          kick: new Audio('audio/Kick.wav'),
          snare: new Audio('audio/Snare.wav'),
          tom1: new Audio('audio/Tom1.wav'),
          tom2: new Audio('audio/Tom2.wav'),
          tom3: new Audio('audio/Tom3.wav'),
          cymbal1: new Audio('audio/Cymbal1.wav'),
          cymbal2: new Audio('audio/Cymbal2.wav')
        };
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    }

    // Sintetizador 80s PolySynth para el Teclado
    function play80sSynth(freq) {
      if (!audioCtx) return;
      try {
        let osc1 = audioCtx.createOscillator();
        let osc2 = audioCtx.createOscillator();
        let filter = audioCtx.createBiquadFilter();
        let gain = audioCtx.createGain();

        osc1.type = 'sawtooth';
        osc1.frequency.setValueAtTime(freq, audioCtx.currentTime);

        osc2.type = 'square';
        osc2.frequency.setValueAtTime(freq * 1.004, audioCtx.currentTime);

        filter.type = 'lowpass';
        filter.frequency.setValueAtTime(freq * 4.5, audioCtx.currentTime);
        filter.frequency.exponentialRampToValueAtTime(freq * 0.9, audioCtx.currentTime + 0.35);

        gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.45);

        osc1.connect(filter);
        osc2.connect(filter);
        filter.connect(gain);
        gain.connect(audioCtx.destination);

        osc1.start();
        osc2.start();
        osc1.stop(audioCtx.currentTime + 0.45);
        osc2.stop(audioCtx.currentTime + 0.45);
      } catch (e) {}
    }

    // Reproductor de muestras de batería con polifonía
    function playDrumSample(audioObj, volume = 0.8) {
      if (audioObj) {
        let clone = audioObj.cloneNode();
        clone.volume = Math.min(1.0, volume);
        clone.play().catch(() => {});
      }
    }

    function playKickSound() {
      playDrumSample(soundLibrary.kick, 0.9);
    }

    function playDrumNoise(duration = 0.1, isCymbal = false, isLeft = true) {
      if (isCymbal) {
        playDrumSample(isLeft ? soundLibrary.cymbal1 : soundLibrary.cymbal2, 0.8);
      }
    }

    // Sistema de control de audio continuo para Guitarra y Trompeta
    function updateAudioEngine(isStrumming, isPlayingTrumpetPose) {
      if (currentInstrument === "GUITARRA") {
        if (isStrumming) {
          guitarActiveTimer = 30;
        }

        if (guitarActiveTimer > 0) {
          if (soundLibrary.guitarra && soundLibrary.guitarra.paused) {
            soundLibrary.guitarra.play().catch(() => {});
          }
          guitarActiveTimer--;
        } else {
          if (soundLibrary.guitarra && !soundLibrary.guitarra.paused) {
            soundLibrary.guitarra.pause();
            soundLibrary.guitarra.currentTime = 0;
          }
        }
      } else {
        if (soundLibrary.guitarra && !soundLibrary.guitarra.paused) {
          soundLibrary.guitarra.pause();
          soundLibrary.guitarra.currentTime = 0;
        }
        guitarActiveTimer = 0;
      }

      if (currentInstrument === "TROMPETA") {
        if (isPlayingTrumpetPose) {
          if (soundLibrary.trompeta && soundLibrary.trompeta.paused) {
            soundLibrary.trompeta.currentTime = 0;
            soundLibrary.trompeta.play().catch(() => {});
          }
        } else {
          if (soundLibrary.trompeta && !soundLibrary.trompeta.paused) {
            soundLibrary.trompeta.pause();
            soundLibrary.trompeta.currentTime = 0;
          }
        }
      } else {
        if (soundLibrary.trompeta && !soundLibrary.trompeta.paused) {
          soundLibrary.trompeta.pause();
          soundLibrary.trompeta.currentTime = 0;
        }
      }
    }

    function setup() {
      let canvas = createCanvas(640, 480);
      canvas.parent('canvas-container');

      for (let i = 0; i < 25; i++) {
        fogParticles.push({
          x: random(width),
          y: random(height - 80, height),
          r: random(40, 90),
          vx: random(-0.4, 0.4),
          alpha: random(15, 35)
        });
      }

      video = createCapture(VIDEO);
      video.size(640, 480);
      video.hide();

      poseNet = ml5.poseNet(video, function() {
        isAiReady = true;
      });

      poseNet.on('pose', function(results) {
        poses = results;
      });
    }

    function draw() {
      background(7, 10, 18);

      if (video) {
        push();
        translate(width, 0);
        scale(-1, 1);
        image(video, 0, 0, width, height);
        pop();

        fill(7, 10, 18, 110);
        noStroke();
        rect(0, 0, width, height);
      }

      drawStageLightingAndEqualizer();

      if (poses.length > 0) {
        let pose = poses[0].pose;

        let lwX = width - pose.leftWrist.x;
        let rwX = width - pose.rightWrist.x;
        let lwY = pose.leftWrist.y;
        let rwY = pose.rightWrist.y;

        let bodyMove = dist(lwX, lwY, prevLwY, prevRwY) + dist(rwX, rwY, prevLwY, prevRwY);
        jamEnergy = lerp(jamEnergy, min(100, bodyMove * 1.5), 0.1);

        checkVirtualButtons(lwX, lwY, rwX, rwY);
        drawInstrumentVisuals(pose);
      } else {
        jamEnergy = lerp(jamEnergy, 0, 0.05);
        updateAudioEngine(false, false);
      }

      drawStageFog();
      updateAndDrawFX();
      drawVirtualButtons();
      drawHUDHeader();
    }

    function drawStageLightingAndEqualizer() {
      let col = [0, 243, 255];
      if (currentInstrument === "GUITARRA") col = [255, 0, 128];
      if (currentInstrument === "BATERÍA") col = [255, 215, 0];
      if (currentInstrument === "TECLADO") col = [255, 50, 30];

      push();
      noStroke();

      fill(col[0], col[1], col[2], 15 + jamEnergy * 0.25);
      quad(0, 0, 120, 0, width * 0.45, height, 0, height);

      fill(col[0], col[1], col[2], 15 + jamEnergy * 0.25);
      quad(width - 120, 0, width, 0, width, height, width * 0.55, height);
      pop();

      let barW = 28;
      let startX = width / 2 - (eqBars.length * barW) / 2;

      for (let i = 0; i < eqBars.length; i++) {
        let targetH = random(12, 35) + (jamEnergy * 1.8) * noise(frameCount * 0.1 + i);
        eqBars[i] = lerp(eqBars[i], targetH, 0.2);

        fill(col[0], col[1], col[2], 45 + eqBars[i] * 0.8);
        noStroke();
        rect(startX + i * barW + 2, height - 90 - eqBars[i], barW - 4, eqBars[i], 3);
      }

      if (jamEnergy > 60 && random() > 0.7) {
        fill(255, 255, 255, random(80, 150));
        noStroke();
        ellipse(random(width), random(height * 0.7), random(15, 35));
      }
    }

    function drawStageFog() {
      noStroke();
      for (let p of fogParticles) {
        p.x += p.vx;
        if (p.x < -50) p.x = width + 50;
        if (p.x > width + 50) p.x = -50;

        fill(200, 220, 255, p.alpha + jamEnergy * 0.15);
        ellipse(p.x, p.y, p.r, p.r * 0.5);
      }
    }

    function checkVirtualButtons(lwX, lwY, rwX, rwY) {
      buttons.forEach(btn => {
        let touchLeft = dist(lwX, lwY, btn.x, btn.y) < btn.r + 12;
        let touchRight = dist(rwX, rwY, btn.x, btn.y) < btn.r + 12;

        if (touchLeft || touchRight) {
          initAudio();
          btn.hoverTime++;
          if (btn.hoverTime >= HOVER_THRESHOLD) {
            if (currentInstrument !== btn.id) {
              currentInstrument = btn.id;
              addConfirmParticles(btn.x, btn.y, btn.color);
              play80sSynth(523.25);
            }
          }
        } else {
          btn.hoverTime = max(0, btn.hoverTime - 2);
        }
      });
    }

    function drawVirtualButtons() {
      let pulse = sin(frameCount * 0.08) * 4;

      buttons.forEach(btn => {
        let isActive = currentInstrument === btn.id;

        push();
        translate(btn.x, btn.y);

        if (isActive) {
          noFill();
          stroke(btn.color[0], btn.color[1], btn.color[2], 100);
          strokeWeight(8 + pulse);
          ellipse(0, 0, btn.r * 2 + 10);
        }

        fill(10, 15, 30, 220);
        stroke(btn.color[0], btn.color[1], btn.color[2], isActive ? 255 : 120);
        strokeWeight(isActive ? 3 : 1.5);
        ellipse(0, 0, btn.r * 2);

        if (btn.hoverTime > 0) {
          noFill();
          stroke(255);
          strokeWeight(4);
          let progressAngle = map(btn.hoverTime, 0, HOVER_THRESHOLD, 0, TWO_PI);
          arc(0, 0, btn.r * 2 + 6, btn.r * 2 + 6, -HALF_PI, -HALF_PI + progressAngle);
        }

        drawButtonIcon(btn.id, btn.color, isActive);

        noStroke();
        fill(isActive ? color(255) : color(180));
        textAlign(CENTER, CENTER);
        textSize(11);
        textStyle(BOLD);
        text(btn.label, 0, btn.r + 16);

        pop();
      });
    }

    function drawButtonIcon(id, col, isActive) {
      stroke(isActive ? color(255) : color(col[0], col[1], col[2], 220));
      strokeWeight(2);

      if (id === "GUITARRA") {
        push();
        rotate(-QUARTER_PI * 0.6);
        line(-2, -14, -2, 2);
        line(2, -14, 2, 2);
        strokeWeight(1.5);
        line(-5, -12, 5, -12);
        line(-5, -8, 5, -8);
        rect(-4, -18, 8, 4, 1);
        fill(col[0], col[1], col[2], isActive ? 255 : 180);
        strokeWeight(1.8);
        beginShape();
        vertex(-9, 2); vertex(-12, -4); vertex(-6, -2); vertex(-7, 12);
        vertex(0, 16); vertex(7, 12); vertex(6, -2); vertex(12, -4); vertex(9, 2);
        endShape(CLOSE);
        pop();
      } else if (id === "BATERÍA") {
        fill(col[0], col[1], col[2], isActive ? 220 : 120);
        strokeWeight(1.8);
        rect(-11, 2, 22, 10, 2);
        ellipse(0, 2, 22, 7);
        ellipse(0, 12, 22, 6);
        stroke(isActive ? color(255) : color(255, 230, 150));
        strokeWeight(2);
        line(-13, -11, 10, 8);
        line(13, -11, -10, 8);
        fill(255);
        noStroke();
        ellipse(-13, -11, 3.5, 3.5);
        ellipse(13, -11, 3.5, 3.5);
      } else if (id === "TROMPETA") {
        noFill();
        strokeWeight(2);
        line(-12, 0, 8, 0);
        fill(col[0], col[1], col[2], isActive ? 255 : 180);
        beginShape();
        vertex(8, -4); vertex(14, -10); vertex(14, 10); vertex(8, 4);
        endShape(CLOSE);
      } else if (id === "TECLADO") {
        fill(col[0], col[1], col[2], isActive ? 255 : 150);
        rect(-12, -8, 24, 16, 2);
        stroke(10, 15, 30);
        strokeWeight(1.5);
        line(-4, -8, -4, 2);
        line(4, -8, 4, 2);
      }
    }

    function addConfirmParticles(x, y, col) {
      for (let i = 0; i < 20; i++) {
        fxParticles.push({
          x: x, y: y,
          vx: random(-5, 5), vy: random(-5, 5),
          size: random(4, 8), color: col, life: 255
        });
      }
    }

    function addShockwave(x, y, col) {
      shockwaves.push({
        x: x, y: y, radius: 10, maxRadius: 80, color: col, alpha: 255
      });
    }

    function addLightningRay(x, y) {
      let numSegments = 5;
      let points = [{x: x, y: y}];
      let curX = x;
      let curY = y;
      let angle = random(0, TWO_PI);

      for (let i = 0; i < numSegments; i++) {
        curX += cos(angle) * random(15, 30) + random(-10, 10);
        curY += sin(angle) * random(15, 30) + random(-10, 10);
        points.push({x: curX, y: curY});
      }

      lightningRays.push({
        points: points,
        color: [0, 243, 255],
        life: 255
      });
    }

    function updateAndDrawFX() {
      for (let i = lightningRays.length - 1; i >= 0; i--) {
        let r = lightningRays[i];
        r.life -= 25;

        stroke(r.color[0], r.color[1], r.color[2], r.life);
        strokeWeight(random(2, 4));
        noFill();
        beginShape();
        for (let pt of r.points) {
          vertex(pt.x, pt.y);
        }
        endShape();

        if (r.life <= 0) lightningRays.splice(i, 1);
      }

      for (let i = fxParticles.length - 1; i >= 0; i--) {
        let p = fxParticles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.life -= 8;

        if (p.symbol) {
          fill(p.color[0], p.color[1], p.color[2], p.life);
          noStroke();
          textAlign(CENTER, CENTER);
          textSize(p.size);
          textStyle(BOLD);
          text(p.symbol, p.x, p.y);
        } else {
          noStroke();
          fill(p.color[0], p.color[1], p.color[2], p.life);
          ellipse(p.x, p.y, p.size);
        }

        if (p.life <= 0) fxParticles.splice(i, 1);
      }

      for (let i = shockwaves.length - 1; i >= 0; i--) {
        let sw = shockwaves[i];
        sw.radius += 4;
        sw.alpha -= 8;

        noFill();
        stroke(sw.color[0], sw.color[1], sw.color[2], sw.alpha);
        strokeWeight(3);
        ellipse(sw.x, sw.y, sw.radius * 2, sw.radius * 0.6);

        if (sw.alpha <= 0) shockwaves.splice(i, 1);
      }
    }

    function drawInstrumentVisuals(pose) {
      let lwX = width - pose.leftWrist.x;
      let rwX = width - pose.rightWrist.x;
      let lwY = pose.leftWrist.y;
      let rwY = pose.rightWrist.y;

      let noseX = width - pose.nose.x;
      let noseY = pose.nose.y;

      if (currentInstrument === "GUITARRA") {
        drawRightHandedGuitar(rwX, rwY, lwX, lwY);
      } else if (currentInstrument === "TROMPETA") {
        drawVectorTrumpet(noseX, noseY, lwX, lwY, rwX, rwY);
      } else if (currentInstrument === "BATERÍA") {
        updateAndDrawDrums(lwX, lwY, rwX, rwY, pose);
      } else if (currentInstrument === "TECLADO") {
        let hipY = (pose.leftHip.y + pose.rightHip.y) / 2;
        drawLaser3DKeyboard(lwX, lwY, rwX, rwY, hipY);
      }
    }

    // --- 1. GUITARRA DIESTRO CON MANOS ANIMADAS ---
    function drawRightHandedGuitar(bodyX, bodyY, neckX, neckY) {
      let angle = atan2(neckY - bodyY, neckX - bodyX);
      let d = 240; 

      let strumSpeed = dist(bodyX, bodyY, prevBodyX, prevBodyY);
      prevBodyX = bodyX;
      prevBodyY = bodyY;

      if (guitarStrumCooldown > 0) guitarStrumCooldown--;

      let isStrumming = false;
      if (strumSpeed > 18 && guitarStrumCooldown === 0) {
        isStrumming = true;
        addLightningRay(bodyX, bodyY);
        for (let k = 0; k < 10; k++) {
          fxParticles.push({
            x: bodyX + random(-30, 30),
            y: bodyY + random(-30, 30),
            vx: random(-7, 7),
            vy: random(-7, 7),
            size: random(8, 18),
            color: [0, 243, 255],
            life: 220
          });
        }
        guitarStrumCooldown = 7;
      }

      updateAudioEngine(isStrumming, false);

      push();
      translate(bodyX, bodyY);
      rotate(angle);

      // Mástil y diapasón
      fill(20, 16, 24);
      stroke(255, 0, 150, 180);
      strokeWeight(1.5);
      rect(0, -11, d, 22, 3);

      stroke(200, 210, 225, 200);
      strokeWeight(1.2);
      let fretPositions = [0.08, 0.16, 0.23, 0.30, 0.37, 0.43, 0.49, 0.55, 0.61, 0.66, 0.71, 0.76, 0.81, 0.85, 0.89, 0.93, 0.97];
      for (let fp of fretPositions) {
        let fx = fp * d;
        line(fx, -11, fx, 11);
      }

      noStroke();
      fill(0, 243, 255, 230);
      let inlayFrets = [0.23, 0.37, 0.49, 0.61, 0.85, 0.93];
      for (let inf of inlayFrets) {
        ellipse(inf * d, 0, 5, 5);
      }
      ellipse(0.71 * d, -5, 4, 4);
      ellipse(0.71 * d, 5, 4, 4);

      // Clavijero
      push();
      translate(d, 0);
      fill(50);
      stroke(220);
      strokeWeight(1.5);
      rect(-2, -12, 6, 24, 1);

      fill(25, 12, 28);
      stroke(255, 0, 150);
      strokeWeight(2);
      beginShape();
      vertex(4, -12); vertex(45, -20); vertex(52, -12); vertex(42, 0); vertex(48, 14); vertex(4, 12);
      endShape(CLOSE);

      stroke(220);
      strokeWeight(1.5);
      fill(180);
      for (let i = 0; i < 3; i++) {
        let px = 12 + i * 11;
        circle(px, -18, 5); line(px, -18, px, -23); rect(px - 3, -26, 6, 3, 1);
        circle(px, 18, 5); line(px, 18, px, 23); rect(px - 3, 23, 6, 3, 1);
      }
      pop();

      // Cuerpo
      fill(18, 8, 22);
      stroke(255, 0, 180, 120);
      strokeWeight(6);
      beginShape();
      vertex(40, -68); vertex(-48, -40); vertex(-85, -78); vertex(-58, 0); vertex(-85, 78); vertex(-48, 40); vertex(40, 68); vertex(78, 0);
      endShape(CLOSE);

      fill(255, 0, 150, 240);
      stroke(255, 255, 255);
      strokeWeight(3.5);
      beginShape();
      vertex(38, -65); vertex(-45, -36); vertex(-80, -72); vertex(-55, 0); vertex(-80, 72); vertex(-45, 36); vertex(38, 65); vertex(72, 0);
      endShape(CLOSE);

      noFill();
      stroke(0, 243, 255, 200);
      strokeWeight(1.8);
      beginShape();
      vertex(28, -45); vertex(-32, -26); vertex(-58, -50); vertex(-40, 0); vertex(-58, 50); vertex(-32, 26); vertex(28, 45);
      endShape();

      // Puente
      fill(35, 38, 45);
      stroke(220);
      strokeWeight(2);
      rect(-24, -20, 36, 40, 3);

      fill(220);
      stroke(80);
      strokeWeight(1);
      for (let s = 0; s < 6; s++) {
        let sy = -15 + s * 6;
        rect(-22, sy, 14, 4.5, 1);
        fill(60);
        circle(-20 + (s % 2) * 2, sy + 2.2, 2);
        fill(220);
      }

      stroke(240);
      strokeWeight(3.5);
      noFill();
      beginShape();
      vertex(-12, 14); vertex(-28, 28); vertex(-15, 55);
      endShape();

      drawHumbucker(-2, 0);
      drawHumbucker(55, 0);
      drawKnob(12, 38);
      drawKnob(42, 32);

      fill(20);
      stroke(0, 243, 255);
      strokeWeight(1.5);
      circle(28, -28, 12);
      fill(240);
      rect(26, -34, 4, 8, 1);

      fill(200);
      stroke(255);
      strokeWeight(1.5);
      ellipse(58, 48, 14, 8);
      fill(20);
      circle(58, 48, 5);

      // Cuerdas
      let stringYOffsets = [-12.5, -7.5, -2.5, 2.5, 7.5, 12.5];
      noFill();
      stroke(0, 243, 255, 160);
      strokeWeight(3.5);
      for (let yOff of stringYOffsets) {
        line(-18, yOff, d + 30, yOff * 0.85);
      }
      for (let i = 0; i < 6; i++) {
        let yOff = stringYOffsets[i];
        stroke(245, 250, 255);
        strokeWeight(1.0 + (i * 0.25));
        line(-18, yOff, d + 30, yOff * 0.85);
      }

      // Manos de Guitarra animadas
      let userArmDist = dist(bodyX, bodyY, neckX, neckY);
      let fretHandX = constrain(map(userArmDist, 100, 320, 45, d - 20), 35, d - 15);
      let strumOffsetY = sin(frameCount * 0.7) * min(16, strumSpeed * 0.7);

      drawGuitarFretHand(fretHandX, 0);
      drawGuitarStrumHand(-15, strumOffsetY);

      pop();
    }

    // Mano izquierda sobre el mástil (Fret Hand corregida hacia arriba)
    function drawGuitarFretHand(hx, hy) {
      push();
      translate(hx, hy);
      scale(1, 1); // Orientación correcta hacia arriba
      
      let glowCol = color(0, 243, 255);
      stroke(glowCol);
      strokeWeight(2.5);
      fill(10, 25, 45, 200);

      // Palma de la mano abrazando el mástil por arriba
      rect(-10, -12, 20, 24, 4);

      // Dedos articulados pisando los trastes hacia arriba
      stroke(glowCol);
      strokeWeight(2);
      line(-6, -12, -6, -18);
      line(-2, -12, -2, -20);
      line(2, -12, 2, -20);
      line(6, -12, 6, -17);

      fill(255, 255, 255);
      noStroke();
      ellipse(-6, -18, 3, 3);
      ellipse(-2, -20, 3, 3);
      ellipse(2, -20, 3, 3);
      ellipse(6, -17, 3, 3);
      pop();
    }

    function drawGuitarStrumHand(hx, hy) {
      push();
      translate(hx, hy);
      scale(1, -1);
      let glowCol = color(255, 0, 150);
      stroke(glowCol);
      strokeWeight(2.5);
      fill(25, 10, 30, 200);
      rect(-12, -12, 24, 24, 6);
      stroke(0, 243, 255);
      strokeWeight(2);
      line(12, -4, 18, 2);
      line(12, 4, 18, 2);
      fill(255, 235, 0);
      noStroke();
      triangle(15, -4, 24, 2, 15, 8);
      fill(255, 255, 255);
      ellipse(17, 2, 2, 2);
      pop();
    }

    function drawHumbucker(hx, hy) {
      push();
      translate(hx, hy);
      fill(15, 15, 20);
      stroke(255, 0, 150);
      strokeWeight(1.5);
      rect(-12, -18, 24, 36, 2);

      fill(30);
      stroke(80);
      strokeWeight(1);
      rect(-9, -15, 8, 30, 1);
      rect(1, -15, 8, 30, 1);

      fill(240);
      noStroke();
      for (let p = 0; p < 6; p++) {
        let py = -12.5 + p * 5;
        circle(-5, py, 2.8);
        circle(5, py, 2.8);
      }
      pop();
    }

    function drawKnob(kx, ky) {
      push();
      translate(kx, ky);
      fill(10, 10, 18);
      stroke(0, 243, 255, 200);
      strokeWeight(1.5);
      circle(0, 0, 15);

      fill(180, 190, 200);
      stroke(40);
      strokeWeight(1);
      circle(0, 0, 11);

      stroke(255, 0, 150);
      strokeWeight(2);
      line(0, 0, 0, -4);
      pop();
    }

    function drawVRHand(x, y, isLeft) {
      push();
      translate(x, y);
      if (isLeft) scale(-1, 1);

      let glowCol = color(0, 243, 255);
      let coreCol = color(255, 255, 255);

      stroke(glowCol);
      strokeWeight(3.5);
      fill(10, 25, 45, 180);

      beginShape();
      vertex(-18, 22); vertex(-16, -2); vertex(-10, -16); vertex(-2, -18);
      vertex(6, -16); vertex(14, -10); vertex(16, 12); vertex(10, 24);
      endShape(CLOSE);

      stroke(glowCol);
      strokeWeight(2.5);
      fill(0, 243, 255, 120);

      beginShape();
      vertex(-16, 2); vertex(-22, -6); vertex(-14, -10); vertex(-8, -4);
      endShape(CLOSE);

      rect(-12, -22, 6, 10, 2);
      rect(-4, -24, 6, 11, 2);
      rect(4, -22, 6, 10, 2);
      rect(11, -16, 5, 8, 2);

      stroke(255, 255, 255, 200);
      strokeWeight(1);
      line(-18, 22, 10, 24);
      line(-10, -16, -10, 10);
      line(-2, -18, -2, 12);
      line(6, -16, 6, 10);

      fill(coreCol);
      noStroke();
      ellipse(-10, -16, 3, 3);
      ellipse(-2, -18, 3, 3);
      ellipse(6, -16, 3, 3);
      ellipse(-16, 2, 3, 3);
      ellipse(0, 18, 4, 4);

      pop();
    }

    // --- 2. BATERÍA ---
    function updateAndDrawDrums(lwX, lwY, rwX, rwY, pose) {
      let lVelY = lwY - prevLwY;
      let rVelY = rwY - prevRwY;

      let centerX = width / 2;
      let cymbalY = 195;
      let leftCymbalX = centerX - 140;
      let rightCymbalX = centerX + 140;

      let kickX = centerX;
      let kickY = 350;
      let kickR = 100;

      let toms = [
        { x: centerX - 110, y: 275, w: 65, h: 42, sound: 'snare' },
        { x: centerX - 38,  y: 260, w: 60, h: 40, sound: 'tom1'  },
        { x: centerX + 38,  y: 260, w: 60, h: 40, sound: 'tom2'  },
        { x: centerX + 110, y: 275, w: 70, h: 46, sound: 'tom3'  }
      ];

      let tipLX = lwX - 12;
      let tipLY = lwY - 60;
      let tipRX = rwX + 12;
      let tipRY = rwY - 60;

      let hitKickL = (lVelY > 7 && (dist(lwX, lwY, kickX, kickY) < kickR / 2 + 20 || dist(tipLX, tipLY, kickX, kickY) < kickR / 2 + 30));
      let hitKickR = (rVelY > 7 && (dist(rwX, rwY, kickX, kickY) < kickR / 2 + 20 || dist(tipRX, tipRY, kickX, kickY) < kickR / 2 + 30));

      let kneeKick = false;
      if (pose.leftKnee && pose.rightKnee) {
        let lKneeY = pose.leftKnee.y;
        let rKneeY = pose.rightKnee.y;
        if ((prevLKneeY - lKneeY > 15) || (prevRKneeY - rKneeY > 15)) {
          kneeKick = true;
        }
        prevLKneeY = lKneeY;
        prevRKneeY = rKneeY;
      }

      if (hitKickL || hitKickR || kneeKick) {
        hitKick = 12;
        addShockwave(kickX, kickY, [255, 50, 30]);
        playKickSound();
      }

      for (let i = 0; i < toms.length; i++) {
        let t = toms[i];
        let hitL = lVelY > 7 && (dist(lwX, lwY, t.x, t.y) < 50 || dist(tipLX, tipLY, t.x, t.y) < 50);
        let hitR = rVelY > 7 && (dist(rwX, rwY, t.x, t.y) < 50 || dist(tipRX, tipRY, t.x, t.y) < 50);

        if (hitL || hitR) {
          hitToms[i] = 10;
          addShockwave(t.x, t.y, [0, 243, 255]);
          playDrumSample(soundLibrary[t.sound], 0.85);
        }
      }

      if (lVelY > 7 && (dist(lwX, lwY, leftCymbalX, cymbalY) < 55 || dist(tipLX, tipLY, leftCymbalX, cymbalY) < 55)) {
        hitLeftCymbal = 10;
        addShockwave(leftCymbalX, cymbalY, [255, 215, 0]);
        playDrumNoise(0.2, true, true);
      }
      if (rVelY > 7 && (dist(rwX, rwY, rightCymbalX, cymbalY) < 55 || dist(tipRX, tipRY, rightCymbalX, cymbalY) < 55)) {
        hitRightCymbal = 10;
        addShockwave(rightCymbalX, cymbalY, [255, 215, 0]);
        playDrumNoise(0.2, true, false);
      }

      prevLwY = lwY;
      prevRwY = rwY;

      push();
      stroke(255, 50, 30);
      strokeWeight(hitKick > 0 ? 4 : 2);
      fill(hitKick > 0 ? color(255, 50, 30, 200) : color(15, 10, 25, 220));
      ellipse(kickX, kickY, kickR + (hitKick > 0 ? hitKick : 0));
      fill(hitKick > 0 ? color(255, 235, 0, 220) : color(30, 20, 40, 220));
      ellipse(kickX, kickY, (kickR - 25));
      noStroke();
      fill(255, 215, 0, 200);
      textAlign(CENTER, CENTER);
      textSize(10);
      textStyle(BOLD);
      text("BOMBO", kickX, kickY);
      pop();

      stroke(255, 215, 0);
      strokeWeight(3);
      let lCymScale = hitLeftCymbal > 0 ? 1.2 : 1.0;
      fill(hitLeftCymbal > 0 ? color(255, 255, 200) : color(255, 215, 0, 180));
      ellipse(leftCymbalX, cymbalY, 110 * lCymScale, 22 * lCymScale);

      let rCymScale = hitRightCymbal > 0 ? 1.2 : 1.0;
      fill(hitRightCymbal > 0 ? color(255, 255, 200) : color(255, 215, 0, 180));
      ellipse(rightCymbalX, cymbalY, 110 * rCymScale, 22 * rCymScale);

      for (let i = 0; i < toms.length; i++) {
        let t = toms[i];
        let hit = hitToms[i] > 0;
        stroke(0, 243, 255);
        strokeWeight(hit ? 3 : 2);
        fill(hit ? color(0, 243, 255, 220) : color(20, 20, 40, 220));
        rect(t.x - t.w / 2, t.y, t.w, t.h + (hit ? hitToms[i] : 0), 6);
        ellipse(t.x, t.y, t.w, 18);
        if (hitToms[i] > 0) hitToms[i]--;
      }

      stroke(255, 215, 0);
      strokeWeight(5);
      line(lwX, lwY, tipLX, tipLY);
      stroke(80, 50, 20);
      strokeWeight(6);
      line(lwX, lwY, lwX - 3, lwY - 14);

      fill(255, 255, 255);
      noStroke();
      ellipse(tipLX, tipLY, 9, 12);
      fill(0, 243, 255, 180);
      ellipse(tipLX, tipLY, 14, 18);

      stroke(255, 215, 0);
      strokeWeight(5);
      line(rwX, rwY, tipRX, tipRY);
      stroke(80, 50, 20);
      strokeWeight(6);
      line(rwX, rwY, rwX + 3, rwY - 14);

      fill(255, 255, 255);
      noStroke();
      ellipse(tipRX, tipRY, 9, 12);
      fill(0, 243, 255, 180);
      ellipse(tipRX, tipRY, 14, 18);

      drawVRHand(lwX, lwY, true);
      drawVRHand(rwX, rwY, false);

      if (hitKick > 0) hitKick--;
      if (hitLeftCymbal > 0) hitLeftCymbal--;
      if (hitRightCymbal > 0) hitRightCymbal--;
    }

    // --- 3. TROMPETA ---
    function drawVectorTrumpet(noseX, noseY, lwX, lwY, rwX, rwY) {
      let handX = (lwX + rwX) / 2;
      let handY = (lwY + rwY) / 2;
      let angle = atan2(handY - noseY, handX - noseX);
      let len = 170;

      let mouthpieceX = handX - cos(angle) * len;
      let mouthpieceY = handY - sin(angle) * len;

      let distMouth = dist(mouthpieceX, mouthpieceY, noseX, noseY);
      let isPlayingPose = (distMouth < 75);

      updateAudioEngine(false, isPlayingPose);

      if (isPlayingPose) {
        if (frameCount % 6 === 0) {
          let bellX = handX;
          let bellY = handY;
          fxParticles.push({
            x: bellX,
            y: bellY,
            vx: cos(angle + random(-0.3, 0.3)) * random(3, 6),
            vy: sin(angle + random(-0.3, 0.3)) * random(3, 6) - 1,
            size: random(14, 20),
            color: [255, 215, 0],
            life: 200,
            symbol: random(['♪', '♫', '♩'])
          });
        }
      }

      push();
      translate(handX, handY);
      rotate(angle);

      let goldBody = isPlayingPose ? color(255, 215, 0) : color(180, 150, 40, 180);
      let goldDark = isPlayingPose ? color(218, 165, 32) : color(130, 100, 20, 180);
      let goldHighlight = isPlayingPose ? color(255, 245, 180) : color(200, 180, 100, 180);

      fill(goldHighlight);
      stroke(goldDark);
      strokeWeight(1.5);
      rect(-len - 4, -5, 8, 10, 2);

      stroke(goldBody);
      strokeWeight(4);
      noFill();
      line(-len + 4, -4, -25, -4);
      line(-len + 15, 4, -35, 4);

      strokeWeight(3.5);
      arc(-len + 20, 0, 18, 14, HALF_PI, 1.5 * PI);

      let valX = -len * 0.38;
      for (let i = 0; i < 3; i++) {
        let vx = valX + i * 11;
        fill(goldDark);
        stroke(goldBody);
        strokeWeight(1.2);
        rect(vx - 4, -18, 8, 22, 2);
        fill(245, 245, 220);
        stroke(goldDark);
        ellipse(vx, -20, 7, 4);
      }

      fill(goldBody);
      stroke(goldHighlight);
      strokeWeight(2);
      beginShape();
      vertex(-35, -7); vertex(0, -32); vertex(0, 32); vertex(-35, 7);
      endShape(CLOSE);

      fill(goldDark);
      ellipse(0, 0, 12, 64);

      if (isPlayingPose) {
        let waveOffset = (frameCount * 4) % 45;
        noFill();
        stroke(255, 235, 100, 220 - waveOffset * 4.5);
        strokeWeight(2.5);
        arc(waveOffset, 0, 20 + waveOffset, 45 + waveOffset, -HALF_PI, HALF_PI);
      }

      pop();
    }

    // --- 4. TECLADO 3D CON SINTETIZADOR 80S ---
    function drawLaser3DKeyboard(lwX, lwY, rwX, rwY, hipY) {
      updateAudioEngine(false, false);

      let numWhiteKeys = 14;
      let kY_top = min(max(hipY - 20, 270), 320);
      let kY_bottom = kY_top + 90;

      let topW = 360;
      let bottomW = 520;
      let topX = width / 2 - topW / 2;
      let bottomX = width / 2 - bottomW / 2;

      let pentatonicScale = [261.63, 293.66, 329.63, 392.00, 440.00, 523.25, 587.33, 659.25, 783.99, 880.00, 1046.50, 1174.66, 1318.51, 1567.98];

      drawKeyboardHUD(width / 2, kY_top - 20);

      for (let i = 0; i < numWhiteKeys; i++) {
        let tx1 = map(i, 0, numWhiteKeys, topX, topX + topW);
        let tx2 = map(i + 1, 0, numWhiteKeys, topX, topX + topW);
        let bx1 = map(i, 0, numWhiteKeys, bottomX, bottomX + bottomW);
        let bx2 = map(i + 1, 0, numWhiteKeys, bottomX, bottomX + bottomW);

        let keyCenterX = (tx1 + tx2 + bx1 + bx2) / 4;
        let touchLeft = dist(lwX, lwY, keyCenterX, (kY_top + kY_bottom) / 2) < 26;
        let touchRight = dist(rwX, rwY, keyCenterX, (kY_top + kY_bottom) / 2) < 26;

        let isPressed = touchLeft || touchRight;

        if (isPressed && frameCount % 4 === 0) {
          play80sSynth(pentatonicScale[i % pentatonicScale.length]);
          fxParticles.push({
            x: keyCenterX + random(-5, 5), y: kY_top + random(0, 20),
            vx: random(-1, 1), vy: random(-4, -2),
            size: random(3, 6), color: [255, 50, 30], life: 180
          });
        }

        fill(isPressed ? color(255, 50, 30, 210) : color(8, 6, 12, 230));
        stroke(255, 50, 30);
        strokeWeight(isPressed ? 3 : 1.8);
        quad(tx1, kY_top, tx2, kY_top, bx2, kY_bottom, bx1, kY_bottom);
      }

      let blackKeyIndices = [0.7, 1.7, 3.7, 4.7, 5.7, 7.7, 8.7, 10.7, 11.7, 12.7];
      let kY_blackBottom = kY_top + 52;

      for (let idx of blackKeyIndices) {
        let bWidthRatio = 0.55;
        let t1 = idx - bWidthRatio / 2;
        let t2 = idx + bWidthRatio / 2;

        let tx1 = map(t1, 0, numWhiteKeys, topX, topX + topW);
        let tx2 = map(t2, 0, numWhiteKeys, topX, topX + topW);

        let midY_ratio = 0.58;
        let bx1 = map(t1, 0, numWhiteKeys, lerp(topX, bottomX, midY_ratio), lerp(topX + topW, bottomX + bottomW, midY_ratio));
        let bx2 = map(t2, 0, numWhiteKeys, lerp(topX, bottomX, midY_ratio), lerp(topX + topW, bottomX + bottomW, midY_ratio));

        let keyCenterX = (tx1 + tx2 + bx1 + bx2) / 4;
        let touchLeft = dist(lwX, lwY, keyCenterX, (kY_top + kY_blackBottom) / 2) < 18;
        let touchRight = dist(rwX, rwY, keyCenterX, (kY_top + kY_blackBottom) / 2) < 18;

        let isPressed = touchLeft || touchRight;

        if (isPressed && frameCount % 4 === 0) {
          play80sSynth(pentatonicScale[Math.floor(idx) % pentatonicScale.length] * 1.059);
        }

        fill(isPressed ? color(255, 235, 0, 240) : color(6, 6, 8, 250));
        stroke(255, 235, 0);
        strokeWeight(2);
        quad(tx1, kY_top, tx2, kY_top, bx2, kY_blackBottom, bx1, kY_blackBottom);
      }

      fill(255, 50, 30, 160);
      noStroke();
      ellipse(lwX, lwY, 18, 18);
      ellipse(rwX, rwY, 18, 18);
    }

    function drawKeyboardHUD(centerX, y) {
      push();
      translate(centerX, y);
      stroke(255, 50, 30, 220);
      strokeWeight(1.5);
      noFill();

      line(-160, 0, 160, 0);

      rectMode(CENTER);
      push();
      rotate(QUARTER_PI);
      rect(0, 0, 8, 8);
      pop();

      rect(-70, -8, 22, 6);
      rect(70, -8, 22, 6);

      line(-110, -8, -85, -8);
      line(85, -8, 110, -8);

      pop();
    }

    function drawHUDHeader() {
      push();
      translate(width / 2, 32);

      fill(10, 15, 30, 210);
      stroke(0, 243, 255, 100);
      strokeWeight(1.5);
      rectMode(CENTER);
      rect(0, 0, 320, 36, 10);

      noStroke();
      textAlign(CENTER, CENTER);
      textSize(12);
      textStyle(BOLD);

      if (!isAiReady) {
        fill(255, 200, 0);
        text("CARGANDO IA...", 0, 0);
      } else {
        fill(0, 243, 255);
        let energyPercent = Math.round(jamEnergy);
        text("MODO: " + currentInstrument + " | STAGE HYPE: " + energyPercent + "%", 0, 0);
      }

      pop();
    }
